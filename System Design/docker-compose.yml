services:
  nginx:
    image: nginx
    ports:
      - 8000:80

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  server1:
    build: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      - SERVER_NAME=pahela server
    ports:
      - 3001:3000

  server2:
    build: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      - SERVER_NAME=dusra server
    ports:
      - 3002:3000

      
  server3:
    build: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      - SERVER_NAME=teesra server
    ports:
      - 3003:3000